name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Host details are secrets (not plain env) so they're masked in the
    # public Actions logs of this public repository.
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and validate internal links
        run: npm run check:links

      - name: Lighthouse budget
        # Mobile Lighthouse on the built homepage. Fails the deploy if a score
        # or the page weight breaks the budget in scripts/lighthouse.mjs, and
        # writes the real scores into every page's footer.
        run: node scripts/lighthouse.mjs

      - name: Verify build artifact
        run: |
          test -s dist/index.html
          test -d dist/_astro
          echo "PASS: Astro production artifact exists"

      - name: Connect runner to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Verify SSH connectivity
        run: |
          nc -z -w 10 "$DEPLOY_HOST" 22
          echo "PASS: deploy host reachable over the tailnet"

      - name: Configure deployment SSH key
        # Secrets enter through env, never spliced into the script source.
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" \
            > ~/.ssh/portfolio_deploy

          chmod 600 ~/.ssh/portfolio_deploy

          printf '%s\n' "$KNOWN_HOSTS" \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Deploy release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          RELEASE="${GITHUB_SHA::7}-$(date -u +%Y%m%d%H%M%S)"

          echo "Deploying release: $RELEASE"

          SSH_ARGS=(
            -i "$HOME/.ssh/portfolio_deploy"
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )

          ssh "${SSH_ARGS[@]}" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_ROOT/releases/$RELEASE'"

          rsync \
            -az \
            --delete \
            -e "ssh -i $HOME/.ssh/portfolio_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            dist/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/releases/$RELEASE/"

          ssh "${SSH_ARGS[@]}" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -s '$DEPLOY_ROOT/releases/$RELEASE/index.html'"

          ssh "${SSH_ARGS[@]}" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "ln -sfn '$DEPLOY_ROOT/releases/$RELEASE' '$DEPLOY_ROOT/current.new' &&
             mv -Tf '$DEPLOY_ROOT/current.new' '$DEPLOY_ROOT/current'"

          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Verify origin
        run: |
          ssh \
            -i ~/.ssh/portfolio_deploy \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "curl -fsS -H 'Host: rafifdzaky.com' http://127.0.0.1:8081/ |
             grep -q 'Rafif Dzaky Daniswara'"

          echo "PASS: origin is serving the new release"

      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/portfolio_deploy

  # Public checks run on a fresh runner that never joined the tailnet. On the
  # deploy runner, Tailscale takes over DNS and public names can fail to
  # resolve, which marked a good deploy as failed.
  verify:
    name: Verify public site
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify public website
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            https://rafifdzaky.com/ |
          grep -q 'Rafif Dzaky Daniswara'

          echo "PASS: public website is healthy"

      - name: Verify security headers
        run: |
          headers="$(curl -sSI https://rafifdzaky.com/)"
          for h in strict-transport-security x-content-type-options x-frame-options referrer-policy; do
            grep -qi "^$h:" <<<"$headers" || { echo "::warning::missing header: $h"; }
          done
          curl -sS https://rafifdzaky.com/ | grep -q 'http-equiv="content-security-policy"' \
            || { echo "::error::CSP meta tag missing from homepage"; exit 1; }
          echo "PASS: CSP present"

      - name: Verify terminal résumé
        run: |
          # Needs the @cli rewrite in the Caddyfile (docs/SECURITY.md). Warn, don't fail.
          if curl -sSL -A "curl/8" https://rafifdzaky.com/ | grep -q "cat experience.log"; then
            echo "PASS: curl rafifdzaky.com serves the terminal résumé"
          else
            echo "::warning::curl rafifdzaky.com still returns HTML; add the @cli rewrite to Caddy"
          fi
          curl -sSf https://rafifdzaky.com/cli.txt -o /dev/null
          echo "PASS: /cli.txt deployed"
