name: Status check

# Checks the public site from outside the homelab (a monitor on the same host
# can't report its own outage) and publishes the history to the `status`
# branch, which /status reads. The branch is force-pushed as a single commit,
# so it never grows.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status-check
  cancel-in-progress: false

jobs:
  check:
    name: Check rafifdzaky.com
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Load previous results
        run: |
          if git fetch --depth 1 origin status 2>/dev/null; then
            git show FETCH_HEAD:uptime.json > prev.json || echo '{}' > prev.json
          else
            echo '{}' > prev.json
          fi

      - name: Check the public site
        run: |
          mkdir -p out
          node scripts/status-check.mjs prev.json out/uptime.json

      - name: Publish to the status branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uptime.json
          git commit -qm "status: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" status
