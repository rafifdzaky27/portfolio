# Production stack on a single VPS. Values come from deploy.env:
#   APP_IMAGE, WEB_IMAGE, APP_TAG, (optional) WORKER_COMMAND
# Laravel's own settings live in laravel.env and are never baked into images.
name: app

x-php: &php
  image: ${APP_IMAGE:?set APP_IMAGE}:${APP_TAG:?set APP_TAG}
  env_file: laravel.env
  restart: unless-stopped
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    redis:
      condition: service_healthy
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '5' }

services:
  app:
    <<: *php
    deploy:
      resources:
        limits: { memory: 512m }

  # Docker's restart policy does the job Supervisor does on a plain VPS.
  # Set WORKER_COMMAND="php artisan horizon" for apps that use Horizon.
  worker:
    <<: *php
    command: ${WORKER_COMMAND:-php artisan queue:work --tries=3 --max-time=3600}
    stop_signal: SIGTERM
    stop_grace_period: 60s
    healthcheck:
      disable: true
    deploy:
      resources:
        limits: { memory: 384m }

  scheduler:
    <<: *php
    command: ['php', 'artisan', 'schedule:work']
    healthcheck:
      disable: true

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE}:${APP_TAG:?set APP_TAG}
    restart: unless-stopped
    # Bound to localhost; TLS is terminated by the host's reverse proxy.
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    restart: unless-stopped
    volumes:
      - redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  storage:
  redis:
