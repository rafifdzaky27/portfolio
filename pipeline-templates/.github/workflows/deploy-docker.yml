# Containerized variant: build once, scan, push an immutable image, then
# deploy that exact image tag. Rollback = start the previous tag.
name: Deploy · Docker production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit SHA to deploy
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: Build and test
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref }}

  image:
    name: Build, scan, push images
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      app: ${{ steps.meta.outputs.app }}
      web: ${{ steps.meta.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Image names
        id: meta
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "app=$repo/app" >> "$GITHUB_OUTPUT"
          echo "web=$repo/web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build locally first so the scan runs before anything is pushed.
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          load: true
          tags: ${{ steps.meta.outputs.app }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Scan app image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.app }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: ${{ steps.meta.outputs.app }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=app

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: ${{ steps.meta.outputs.web }}:${{ steps.meta.outputs.tag }}
          cache-from: |
            type=gha,scope=app
            type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Deploy
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      TAG: ${{ needs.image.outputs.tag }}
      STACK_DIR: ${{ vars.STACK_DIR }}
      HEALTH_URL: ${{ vars.PRODUCTION_URL }}/up
    steps:
      - name: Checkout deploy scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: |
            deploy
            compose.production.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host target
            HostName $HOST
            User $USER
            Port $PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      # The compose file travels with the commit, so infra changes are reviewed like code.
      - name: Sync stack definition
        run: scp -q compose.production.yml deploy/docker-deploy.sh "target:$STACK_DIR/"

      - name: Roll out
        id: rollout
        run: ssh target "STACK_DIR='$STACK_DIR' bash '$STACK_DIR/docker-deploy.sh' deploy '$TAG'"

      - name: Health check
        id: health
        run: |
          code=000
          for attempt in $(seq 1 10); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "$HEALTH_URL" || echo 000)
            if [ "$code" = "200" ]; then
              echo "Healthy after $attempt attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Health check failed: $HEALTH_URL returned HTTP $code"
          exit 1

      - name: Roll back
        if: ${{ failure() && steps.health.outcome == 'failure' }}
        run: |
          ssh target "STACK_DIR='$STACK_DIR' bash '$STACK_DIR/docker-deploy.sh' rollback"
          echo "::warning::Rolled back to the previous image. Database migrations are NOT reverted."

      - name: Clean up
        if: ${{ always() }}
        run: rm -f ~/.ssh/deploy_key

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### Production deploy: ${{ job.status }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image tag | \`$TAG\` |"
            echo "| Ref | \`${{ inputs.ref }}\` |"
            echo "| Approved run by | @${{ github.actor }} |"
            echo "| Health check | ${{ steps.health.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
